<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2DGS-SLAM — Spark live map</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 10;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.55);
        color: #e8e8e8;
        font-size: 12px;
        line-height: 1.4;
        border-radius: 6px;
        max-width: 90vw;
      }
      #err {
        color: #f88;
      }
      #controls {
        position: fixed;
        right: 8px;
        top: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #controls label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.55);
        color: #e8e8e8;
        font-size: 12px;
        border-radius: 6px;
        cursor: pointer;
        user-select: none;
      }
      #controls input[type="checkbox"] {
        accent-color: #00cc88;
      }
      #controls button {
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.55);
        color: #e8e8e8;
        font-size: 12px;
        border-radius: 6px;
        border: 1px solid #555;
        cursor: pointer;
        user-select: none;
      }
      #controls button:hover {
        background: rgba(60, 60, 60, 0.7);
      }
      #btnSpread {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.55);
        color: #e8e8e8;
        font-size: 13px;
        border-radius: 6px;
        border: 1px solid #555;
        cursor: pointer;
        user-select: none;
      }
      #btnSpread:hover {
        background: rgba(60, 60, 60, 0.7);
      }
      #btnSpread.active {
        background: rgba(0, 140, 80, 0.6);
        border-color: #00cc88;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.0.0/spark.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <!-- <div>Polling <code>live.ply</code> + <code>traj_live.json</code>.</div>
      <div>Open this page via your PC’s LAN URL (see SLAM terminal) for phones/tablets.</div> -->
      <div>Use drag / wheel / WASD to pan, arrow keys to rotate.</div>
      <div id="status">Waiting for first chunk…</div>
      <div id="err"></div>
    </div>
    <div id="controls">
      <label><input type="checkbox" id="toggleTraj" checked /> Trajectory</label>
      <label><input type="checkbox" id="toggleKf" /> Keyframes</label>
      <label><input type="checkbox" id="toggleFollow" /> Follow Camera</label>
    </div>
    <button id="btnSpread">Spread</button>
    <script type="module">
      import * as THREE from "three";
      import { Line2 } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/lines/Line2.js";
      import { LineGeometry } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/lines/LineGeometry.js";
      import { LineMaterial } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/lines/LineMaterial.js";
      import { LineSegments2 } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/lines/LineSegments2.js";
      import { LineSegmentsGeometry } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/lines/LineSegmentsGeometry.js";
      import { SplatMesh, SparkRenderer, dyno } from "@sparkjsdev/spark";

      const hudStatus = document.getElementById("status");
      const hudErr = document.getElementById("err");

      const params = new URLSearchParams(location.search);
      const paramInterval = params.get("interval");
      let intervalMs = paramInterval ? Math.max(2000, parseInt(paramInterval, 10) || 5000) : 0;
      const trajLinePx = Math.max(
        2,
        parseFloat(params.get("trajw") || "6") || 6,
      );
      const loopLinePx = Math.max(1, trajLinePx * 0.35);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1e);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.01,
        5000,
      );
      camera.position.set(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      const spark = new SparkRenderer({ renderer });
      scene.add(spark);

      const sceneRoot = new THREE.Group();
      scene.add(sceneRoot);
      const alignQuat = new THREE.Quaternion();

      const controls = {
        keys: {},
        mouseDragging: false,
        lastX: 0,
        lastY: 0,
        yaw: 0,
        pitch: -0.15,
        dist: 2.5,
        target: new THREE.Vector3(1, 0, 0),
      };

      function sphericalToOffset() {
        const cp = Math.cos(controls.pitch);
        const x = controls.dist * cp * Math.sin(controls.yaw);
        const y = controls.dist * Math.sin(controls.pitch);
        const z = controls.dist * cp * Math.cos(controls.yaw);
        return new THREE.Vector3(x, y, z);
      }

      function syncCamera() {
        camera.up.set(0, 1, 0);
        const off = sphericalToOffset();
        camera.position.copy(controls.target).add(off);
        camera.lookAt(controls.target);
      }
      syncCamera();

      window.addEventListener("keydown", (e) => {
        controls.keys[e.code] = true;
      });
      window.addEventListener("keyup", (e) => {
        controls.keys[e.code] = false;
      });
      renderer.domElement.addEventListener("pointerdown", (e) => {
        controls.mouseDragging = true;
        controls.lastX = e.clientX;
        controls.lastY = e.clientY;
      });
      window.addEventListener("pointerup", () => {
        controls.mouseDragging = false;
      });
      window.addEventListener("pointermove", (e) => {
        if (!controls.mouseDragging) return;
        const dx = e.clientX - controls.lastX;
        const dy = e.clientY - controls.lastY;
        controls.lastX = e.clientX;
        controls.lastY = e.clientY;
        controls.yaw -= dx * 0.005;
        controls.pitch -= dy * 0.005;
        controls.pitch = Math.max(-1.4, Math.min(1.4, controls.pitch));
        syncCamera();
      });
      renderer.domElement.addEventListener("wheel", (e) => {
        e.preventDefault();
        controls.dist *= 1 + Math.sign(e.deltaY) * 0.12;
        controls.dist = Math.max(0.05, Math.min(800, controls.dist));
        syncCamera();
      });

      let liveOverlayLineMaterials = [];

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        liveOverlayLineMaterials.forEach((mat) => {
          if (mat.resolution) {
            mat.resolution.set(window.innerWidth, window.innerHeight);
          }
        });
      });

      let currentMesh = null;
      let reloadPending = false;
      let trajGroup = null;
      let kfGroup = null;
      let cameraInitialised = false;
      let showTraj = true;
      let showKf = false;
      let followCamera = false;

      const toggleTrajEl = document.getElementById("toggleTraj");
      toggleTrajEl.addEventListener("change", () => {
        showTraj = toggleTrajEl.checked;
        if (trajGroup) trajGroup.visible = showTraj;
      });

      const toggleKfEl = document.getElementById("toggleKf");
      toggleKfEl.addEventListener("change", () => {
        showKf = toggleKfEl.checked;
        if (kfGroup) kfGroup.visible = showKf;
      });

      const toggleFollowEl = document.getElementById("toggleFollow");
      toggleFollowEl.addEventListener("change", () => {
        followCamera = toggleFollowEl.checked;
        if (followCamera && latestC2W) snapToView(latestC2W);
      });

      let latestC2W = null;

      const animateT = dyno.dynoFloat(0);
      let spreadActive = false;
      let spreadBaseTime = 0;

      function applySpreadModifier(mesh) {
        mesh.objectModifier = dyno.dynoBlock(
          { gsplat: dyno.Gsplat },
          { gsplat: dyno.Gsplat },
          ({ gsplat }) => {
            const d = new dyno.Dyno({
              inTypes: { gsplat: dyno.Gsplat, t: "float" },
              outTypes: { gsplat: dyno.Gsplat },
              globals: () => [],
              statements: ({ inputs, outputs }) => dyno.unindentLines(`
                ${outputs.gsplat} = ${inputs.gsplat};
                float t = ${inputs.t};
                float s = smoothstep(0.,10.,t-4.5)*10.;
                vec3 scales = ${inputs.gsplat}.scales;
                vec3 localPos = ${inputs.gsplat}.center;
                float l = length(localPos.xz);
                float tt = t*t*.4+.5;
                localPos.xz *= min(1.,.3+max(0.,tt*.05));
                ${outputs.gsplat}.center = localPos;
                ${outputs.gsplat}.scales = max(mix(vec3(0.0),scales,min(tt-7.-l*2.5,1.)),mix(vec3(0.0),scales*.2,min(tt-1.-l*2.,1.)));
                ${outputs.gsplat}.rgba = mix(vec4(.3),${inputs.gsplat}.rgba,clamp(tt-l*2.5-3.,0.,1.));
              `),
            });
            gsplat = d.apply({ gsplat, t: animateT }).gsplat;
            return { gsplat };
          }
        );
        mesh.updateGenerator();
      }

      function removeSpreadModifier(mesh) {
        mesh.objectModifier = null;
        mesh.updateGenerator();
      }

      const btnSpread = document.getElementById("btnSpread");
      btnSpread.addEventListener("click", () => {
        spreadActive = !spreadActive;
        btnSpread.classList.toggle("active", spreadActive);
        if (spreadActive) {
          spreadBaseTime = 0;
          animateT.value = 0;
          if (currentMesh) applySpreadModifier(currentMesh);
        } else {
          if (currentMesh) removeSpreadModifier(currentMesh);
        }
      });

      function jetRGB(t) {
        t = Math.max(0, Math.min(1, t));
        return [
          Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 3))),
          Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 2))),
          Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 1))),
        ];
      }

      const frustumSize = 0.05;
      function buildFrustumSegments(c2wRows) {
        const s = frustumSize;
        const local = [
          [0, 0, 0],
          [s, -0.5 * s, 2 * s],
          [-s, -0.5 * s, 2 * s],
          [s, 0.5 * s, 2 * s],
          [-s, 0.5 * s, 2 * s],
        ];
        const edges = [[0,1],[0,2],[0,3],[0,4],[1,2],[1,3],[2,4],[3,4]];
        const world = local.map(v => {
          const wx = c2wRows[0][0]*v[0] + c2wRows[0][1]*v[1] + c2wRows[0][2]*v[2] + c2wRows[0][3];
          const wy = c2wRows[1][0]*v[0] + c2wRows[1][1]*v[1] + c2wRows[1][2]*v[2] + c2wRows[1][3];
          const wz = c2wRows[2][0]*v[0] + c2wRows[2][1]*v[1] + c2wRows[2][2]*v[2] + c2wRows[2][3];
          return [wx, -wy, -wz];
        });
        const arr = [];
        for (const [a, b] of edges) arr.push(...world[a], ...world[b]);
        return new Float32Array(arr);
      }

      const followBehindDist = 0.6;

      function snapToView(c2wRows) {
        const r = c2wRows;
        const glc2w = new THREE.Matrix4();
        glc2w.set(
           r[0][0], -r[0][1], -r[0][2],  r[0][3],
          -r[1][0],  r[1][1],  r[1][2], -r[1][3],
          -r[2][0],  r[2][1],  r[2][2], -r[2][3],
           0,        0,        0,        1,
        );
        const alignMat = new THREE.Matrix4().makeRotationFromQuaternion(alignQuat);
        const aligned = alignMat.multiply(glc2w);
        const pos = new THREE.Vector3();
        const quat = new THREE.Quaternion();
        aligned.decompose(pos, quat, new THREE.Vector3());

        const lookDir = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
        controls.target.copy(pos).addScaledVector(lookDir, 0.5);
        const behindPos = pos.clone().addScaledVector(lookDir, -followBehindDist);
        const ox = behindPos.x - controls.target.x;
        const oy = behindPos.y - controls.target.y;
        const oz = behindPos.z - controls.target.z;
        controls.dist = Math.sqrt(ox * ox + oy * oy + oz * oz);
        controls.pitch = Math.asin(Math.max(-1, Math.min(1, oy / controls.dist)));
        controls.yaw = Math.atan2(ox, oz);
        syncCamera();
      }

      function disposeMesh(m) {
        if (!m) return;
        sceneRoot.remove(m);
        m.dispose?.();
      }

      function disposeGroup(g) {
        if (!g) return;
        sceneRoot.remove(g);
        g.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) o.material.dispose();
        });
      }

      function computeAlignment(c2wRows) {
        const r = c2wRows;
        const upCvX = -r[0][1], upCvY = -r[1][1], upCvZ = -r[2][1];
        const upGl = new THREE.Vector3(upCvX, -upCvY, -upCvZ).normalize();
        alignQuat.setFromUnitVectors(upGl, new THREE.Vector3(0, 1, 0));
        sceneRoot.quaternion.copy(alignQuat);
      }

      function clearTraj() {
        liveOverlayLineMaterials = [];
        disposeGroup(trajGroup);
        trajGroup = null;
        disposeGroup(kfGroup);
        kfGroup = null;
      }

      async function reloadTraj() {
        try {
          const res = await fetch(`traj_live.json?ts=${Date.now()}`, { cache: "no-store" });
          if (!res.ok) return;
          const data = await res.json();
          if (!intervalMs && data.poll_interval_ms) {
            intervalMs = Math.max(2000, data.poll_interval_ms);
            restartPoller();
          }
          const pos = data.positions;
          clearTraj();
          trajGroup = new THREE.Group();
          const rw = window.innerWidth;
          const rh = window.innerHeight;

          if (pos && pos.length >= 2) {
            const arr = new Float32Array(pos.length * 3);
            const colors = new Float32Array(pos.length * 3);
            const fids = data.frame_ids;
            const fmin = fids ? fids[0] : 0;
            const fmax = fids ? fids[fids.length - 1] : pos.length - 1;
            const frange = fmax - fmin || 1;
            for (let i = 0; i < pos.length; i++) {
              arr[i * 3] = pos[i][0];
              arr[i * 3 + 1] = -pos[i][1];
              arr[i * 3 + 2] = -pos[i][2];
              const t = (fids ? fids[i] - fmin : i) / frange;
              const [r, g, b] = jetRGB(t);
              colors[i * 3] = r;
              colors[i * 3 + 1] = g;
              colors[i * 3 + 2] = b;
            }
            const lineGeom = new LineGeometry();
            lineGeom.setPositions(arr);
            lineGeom.setColors(colors);
            const lineMat = new LineMaterial({
              linewidth: trajLinePx,
              worldUnits: false,
              vertexColors: true,
            });
            lineMat.resolution.set(rw, rh);
            liveOverlayLineMaterials.push(lineMat);
            const line2 = new Line2(lineGeom, lineMat);
            line2.computeLineDistances();
            trajGroup.add(line2);

            const edges = data.loop_edges;
            if (edges && edges.length > 0) {
              const verts = [];
              for (let e = 0; e < edges.length; e++) {
                const a = edges[e][0];
                const b = edges[e][1];
                if (a < 0 || b < 0 || a >= pos.length || b >= pos.length) continue;
                verts.push(
                  pos[a][0],
                  -pos[a][1],
                  -pos[a][2],
                  pos[b][0],
                  -pos[b][1],
                  -pos[b][2],
                );
              }
              if (verts.length >= 6) {
                const segGeom = new LineSegmentsGeometry();
                segGeom.setPositions(verts);
                const segMat = new LineMaterial({
                  color: 0x008000,
                  linewidth: loopLinePx,
                  worldUnits: false,
                });
                segMat.resolution.set(rw, rh);
                liveOverlayLineMaterials.push(segMat);
                const seg2 = new LineSegments2(segGeom, segMat);
                trajGroup.add(seg2);
              }
            }
          }

          if (data.current_view && data.current_view.c2w_rows) {
            latestC2W = data.current_view.c2w_rows;
            if (followCamera) snapToView(latestC2W);
            const fVerts = buildFrustumSegments(data.current_view.c2w_rows);
            const fGeom = new LineSegmentsGeometry();
            fGeom.setPositions(fVerts);
            const fMat = new LineMaterial({
              color: 0x00ff00,
              linewidth: trajLinePx,
              worldUnits: false,
            });
            fMat.resolution.set(rw, rh);
            liveOverlayLineMaterials.push(fMat);
            const fLine = new LineSegments2(fGeom, fMat);
            trajGroup.add(fLine);
          }

          const kfViews = data.keyframe_views;
          if (kfViews && kfViews.length > 0) {
            kfGroup = new THREE.Group();
            for (const kv of kfViews) {
              if (!kv.c2w_rows) continue;
              const kVerts = buildFrustumSegments(kv.c2w_rows);
              const kGeom = new LineSegmentsGeometry();
              kGeom.setPositions(kVerts);
              const kMat = new LineMaterial({
                color: 0xff0000,
                linewidth: trajLinePx * 0.6,
                worldUnits: false,
              });
              kMat.resolution.set(rw, rh);
              liveOverlayLineMaterials.push(kMat);
              kfGroup.add(new LineSegments2(kGeom, kMat));
            }
            if (kfGroup.children.length > 0) {
              kfGroup.visible = showKf;
              sceneRoot.add(kfGroup);
            } else {
              kfGroup = null;
            }
          }

          if (!cameraInitialised && data.first_view && data.first_view.c2w_rows) {
            computeAlignment(data.first_view.c2w_rows);
            snapToView(data.first_view.c2w_rows);
            cameraInitialised = true;
          }

          if (trajGroup.children.length > 0) {
            trajGroup.visible = showTraj;
            sceneRoot.add(trajGroup);
          } else {
            trajGroup = null;
          }
        } catch (_) {
          /* optional until first export */
        }
      }

      async function reloadPly() {
        if (reloadPending) return;
        reloadPending = true;
        const url = `live.ply?ts=${Date.now()}`;
        hudErr.textContent = "";
        hudStatus.textContent = "Fetching map…";

        let res;
        try {
          res = await fetch(url, { cache: "no-store" });
        } catch (e) {
          hudErr.textContent = String(e?.message || e);
          reloadPending = false;
          return;
        }
        if (!res.ok) {
          hudStatus.textContent = "No live.ply yet (" + res.status + "). Retrying…";
          reloadPending = false;
          return;
        }

        let buf;
        try {
          buf = await res.arrayBuffer();
        } catch (e) {
          hudErr.textContent = String(e?.message || e);
          reloadPending = false;
          return;
        }

        hudStatus.textContent =
          "Downloaded " + (buf.byteLength / (1024 * 1024)).toFixed(2) + " MB — decoding (Spark)…";

        try {
          const mesh = new SplatMesh({
            fileBytes: buf,
            fileName: "live.ply",
          });
          await mesh.initialized;
          disposeMesh(currentMesh);
          currentMesh = mesh;
          mesh.quaternion.set(1, 0, 0, 0);
          mesh.position.set(0, 0, 0);
          if (spreadActive) applySpreadModifier(mesh);
          sceneRoot.add(mesh);
        } catch (e) {
          hudErr.textContent = String(e?.message || e);
          reloadPending = false;
          return;
        }

        if (currentMesh) {
          const n = currentMesh.numSplats ?? currentMesh.packedSplats?.numSplats ?? "?";
          hudStatus.textContent = "Splats: " + n + " — next refresh in " + (intervalMs / 1000) + "s";
        }
        reloadPending = false;
      }

      async function tick() {
        await reloadTraj();
        await reloadPly();
      }

      renderer.setAnimationLoop(() => {
        const step = 0.04;
        const rotStep = 0.025;
        if (controls.keys["KeyW"]) {
          const dir = new THREE.Vector3();
          camera.getWorldDirection(dir);
          controls.target.addScaledVector(dir, step);
        }
        if (controls.keys["KeyS"]) {
          const dir = new THREE.Vector3();
          camera.getWorldDirection(dir);
          controls.target.addScaledVector(dir, -step);
        }
        if (controls.keys["KeyD"]) {
          const dir = new THREE.Vector3();
          camera.getWorldDirection(dir);
          dir.cross(camera.up).normalize();
          controls.target.addScaledVector(dir, step);
        }
        if (controls.keys["KeyA"]) {
          const dir = new THREE.Vector3();
          camera.getWorldDirection(dir);
          dir.cross(camera.up).normalize();
          controls.target.addScaledVector(dir, -step);
        }
        if (controls.keys["ArrowLeft"]) controls.yaw += rotStep;
        if (controls.keys["ArrowRight"]) controls.yaw -= rotStep;
        if (controls.keys["ArrowUp"]) {
          controls.pitch = Math.min(1.4, controls.pitch + rotStep);
        }
        if (controls.keys["ArrowDown"]) {
          controls.pitch = Math.max(-1.4, controls.pitch - rotStep);
        }
        syncCamera();
        if (spreadActive && currentMesh) {
          spreadBaseTime += 1.0 / 60;
          animateT.value = spreadBaseTime;
          currentMesh.updateVersion();
        }
        renderer.render(scene, camera);
      });

      if (!intervalMs) intervalMs = 5000;
      let pollTimer = null;
      function restartPoller() {
        if (pollTimer !== null) clearInterval(pollTimer);
        pollTimer = setInterval(() => tick().catch((e) => (hudErr.textContent = String(e))), intervalMs);
      }
      tick();
      restartPoller();
    </script>
  </body>
</html>
